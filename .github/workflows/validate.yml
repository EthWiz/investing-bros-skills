name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest numpy
      - name: Validate skill frontmatter and layout
        run: python3 tools/validate_skills.py
      - name: Unit tests for skill scripts
        run: python3 -m pytest -q skills
      - name: Shell scripts parse
        run: for f in skills/*/scripts/*.sh; do bash -n "$f"; done
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
